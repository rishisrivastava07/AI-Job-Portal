server:
  port: ${SERVER_PORT:5002}

spring:
  application:
    name: job-portal-company-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_portal_company}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:rishi@123}
    driver-class-name: org.postgresql.Driver
